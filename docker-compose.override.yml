# Local development only (loaded automatically by a plain `docker compose up`).
# Exposes the backend on http://localhost:8000 so `npm run dev` (live reload on http://localhost:5173) can reach it.
# The server deploy uses `-f docker-compose.yml -f docker-compose.prod.yml`, which does NOT load this file.
services:
  backend:
    ports: ["127.0.0.1:8000:8000"]
