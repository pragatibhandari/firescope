server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on; gzip_types application/json application/javascript text/css application/geo+json;
  client_max_body_size 1024m;
  location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 1800s; proxy_send_timeout 1800s; }
  location / { try_files $uri /index.html; }
}
